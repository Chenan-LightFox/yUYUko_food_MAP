<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="东方饭联地图网站信息展示页">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#f9f8fa">
    <title>东方饭联地图</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            color-scheme: light;
            --bg: #f9f8fa;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-soft: #f7f2f8;
            --border: #e6dceb;
            --text: #2b2533;
            --text-secondary: #6e6578;
            --primary: #e2789f;
            --secondary: #8c6bb1;
            --shadow: 0 18px 50px rgba(83, 58, 92, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 8%, rgba(226, 120, 159, 0.16), transparent 28rem),
                radial-gradient(circle at 90% 88%, rgba(140, 107, 177, 0.13), transparent 26rem),
                var(--bg);
            color: var(--text);
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.7;
        }

        .page {
            display: flex;
            width: min(100% - 40px, 960px);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 52px 0 28px;
            flex-direction: column;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            gap: 10px;
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border: 1px solid rgba(226, 120, 159, 0.36);
            border-radius: 11px;
            background: linear-gradient(145deg, #fff, #f8e8ef);
            box-shadow: 0 6px 18px rgba(226, 120, 159, 0.18);
            color: var(--primary);
            font-family: Georgia, serif;
            font-size: 21px;
        }

        main {
            display: grid;
            margin: auto 0;
            padding: 56px 0;
            grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
            gap: 64px;
            align-items: center;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--secondary);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.18em;
        }

        h1 {
            margin: 0;
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1.08;
            letter-spacing: -0.055em;
        }

        .lead {
            max-width: 620px;
            margin: 24px 0 0;
            color: var(--text-secondary);
            font-size: clamp(16px, 2.2vw, 19px);
        }

        .tags {
            display: flex;
            margin-top: 30px;
            padding: 0;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
        }

        .tags li {
            padding: 7px 13px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
        }

        .info-card {
            position: relative;
            overflow: hidden;
            padding: 30px;
            border: 1px solid rgba(230, 220, 235, 0.9);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .info-card::before {
            position: absolute;
            top: 0;
            right: 0;
            width: 96px;
            height: 96px;
            border-radius: 0 0 0 100%;
            background: linear-gradient(135deg, rgba(226, 120, 159, 0.18), rgba(140, 107, 177, 0.1));
            content: "";
        }

        .info-card h2 {
            position: relative;
            margin: 0 0 18px;
            font-size: 20px;
        }

        .info-card p {
            position: relative;
            margin: 0;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .rule {
            width: 44px;
            height: 3px;
            margin: 22px 0;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        footer {
            display: grid;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        footer p {
            margin: 0;
        }

        footer p:last-child {
            text-align: right;
        }

        .filing-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 14px;
        }

        footer a {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-secondary);
            text-decoration: none;
        }

        footer a img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        footer a:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
            border-radius: 2px;
        }

        @media (max-width: 760px) {
            .page {
                width: min(100% - 32px, 560px);
                padding-top: 28px;
            }

            main {
                padding: 58px 0;
                grid-template-columns: 1fr;
                gap: 38px;
            }

            h1 {
                font-size: clamp(40px, 14vw, 62px);
            }

            .info-card {
                padding: 24px;
                border-radius: 18px;
            }

            footer {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            .filing-links {
                justify-content: flex-start;
                margin: 3px 0;
            }

            footer p:last-child {
                text-align: left;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="brand" aria-label="东方饭联地图">
            <span class="brand-mark" aria-hidden="true">樱</span>
            <span>东方饭联地图</span>
        </header>

        <main>
            <section aria-labelledby="page-title">
                <p class="eyebrow">TOUHOU FOOD ALLIANCE MAP</p>
                <h1 id="page-title">发现身边的<br>好味道</h1>
                <p class="lead">
                    东方饭联地图专注于餐饮地点与用餐灵感的整理和分享，帮助访客更轻松地了解附近值得探访的餐厅。
                </p>
                <ul class="tags" aria-label="网站内容">
                    <li>餐饮地点</li>
                    <li>地图导览</li>
                    <li>用餐灵感</li>
                </ul>
            </section>

            <aside class="info-card" aria-labelledby="about-title">
                <h2 id="about-title">关于本站</h2>
                <p>
                    本站为非经营性信息展示网站，内容以餐饮地点介绍、地图信息整理和用餐文化交流为主。
                </p>
                <hr class="rule">
                <p>
                    页面内容正在持续整理与完善，感谢关注。
                </p>
            </aside>
        </main>

        <footer>
            <p>© 2026 东方饭联地图</p>
            <div class="filing-links">
                <a href="%VITE_ICP_BEIAN_URL%" target="_blank" rel="noopener noreferrer">%VITE_ICP_BEIAN_TEXT%</a>
                <a href="%VITE_GONGAN_BEIAN_URL%" target="_blank" rel="noopener noreferrer">
                    <img src="../ghs.png" alt="" aria-hidden="true">
                    %VITE_GONGAN_BEIAN_TEXT%
                </a>
            </div>
            <p>dinnerparty.cc</p>
        </footer>
    </div>
</body>

</html>
